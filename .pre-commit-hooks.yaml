- id: sync-sonar-coverage-exclusions
  name: Sync sonar.coverage.exclusions from coverage omit
  entry: hooks/sync_sonar_coverage_exclusions.sh
  language: script
  files: ^(pyproject\.toml|sonar-project\.properties)$
  pass_filenames: false

- id: gitleaks
  name: Detect hardcoded secrets
  entry: hooks/gitleaks.sh
  language: script
  pass_filenames: false

- id: check-charset
  name: Check for disallowed Unicode characters
  entry: hooks/check_charset.sh
  language: script
  types: [text]

- id: format
  name: Formatting
  entry: lets fmt
  language: system
  types: [python]
  pass_filenames: false

- id: validate
  name: Validation
  entry: lets val
  language: system
  types: [python]
  pass_filenames: false
